- id: api-health-register
  category: portal.categories.health
  method: POST
  path: /api/pvi/v1/health/register
  description: Dang ky bao hiem suc khoe
  requestSample:
    CpId: nguyen van a
    GoiBaoHiem: HEALTH_GOLD
  responseFormat:
    Status: "00"
    Message: Thanh cong

- id: api-health-query
  category: portal.categories.health
  method: POST
  path: /api/pvi/v1/health/query
  description: Tra cuu bao hiem suc khoe
  requestSample:
    CpId: nguyen van a
    so_gcn: GCN/HEALTH/2026/001
  responseFormat:
    Status: "00"
    Message: Tra cuu thanh cong

- id: api-health-claim
  category: portal.categories.health
  method: POST
  path: /api/pvi/v1/health/claim
  description: Khai bao boi thuong bao hiem suc khoe
  requestSample:
    CpId: nguyen van a
    so_gcn: GCN/HEALTH/2026/001
    soTienYeuCau: 5000000
    lyDo: Viem hong cap
  responseFormat:
    Status: "00"
    Message: Tiep nhan yeu cau boi thuong thanh cong

