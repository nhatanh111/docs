services:
  postgres:
    image: postgres:16-alpine
    container_name: pvi-db
    environment:
      POSTGRES_DB: pvi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
